# Label "regenerate" on a daily slopper PR (repo owner only) → close it and generate that date again
# (DESIGN §16.4, decision 47). No limit. The closed attempt keeps its branch, so it can be reopened and published.
name: regenerate

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  regenerate:
    if: >-
      github.event.label.name == 'regenerate' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'slopper/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # dispatch generate.yml
    steps:
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Close and dispatch
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^slopper/([0-9]{4}-[0-9]{2}-[0-9]{2})(-[0-9]+)?$ ]] || { echo "::error::unexpected branch $BRANCH"; exit 1; }
          date="${BASH_REMATCH[1]}"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Regenerating $date: a new attempt will open as a new PR. This attempt is kept (its branch stays): reopen this PR to publish it instead."
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY"
          GH_TOKEN="$ACTIONS_TOKEN" gh workflow run generate.yml --repo "$GITHUB_REPOSITORY" --ref main -f date="$date"
