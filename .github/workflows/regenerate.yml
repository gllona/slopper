# Label "regenerate" on a daily slopper PR (repo owner only) → close it and generate that date again
# (DESIGN §16.4). At most 2 regenerations per date, counted from closed PRs of the same branch.
name: regenerate

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  regenerate:
    if: >-
      github.event.label.name == 'regenerate' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'slopper/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # dispatch generate.yml
    steps:
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Close and dispatch
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          date="${BRANCH#slopper/}"
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::unexpected branch $BRANCH"; exit 1; }
          closed=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state closed --json number --jq length)
          if [ "$closed" -ge 2 ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Not regenerating: $date was already regenerated $closed times (maximum 2). Edit this PR by hand, or close it."
            exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Regenerating $date (attempt $((closed + 2)))."
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --delete-branch
          GH_TOKEN="$ACTIONS_TOKEN" gh workflow run generate.yml --repo "$GITHUB_REPOSITORY" --ref main -f date="$date"
