# Daily slopper (DESIGN §16.1): fetch (no AI) → create (AI, read-only) → open-pr (no AI, bot token).
# GitHub cron has no guaranteed start time (it started 3 h 42 min late on 2026-09-27), so there are three
# scheduled tries (06:07, 08:07, 10:07 in UTC-5); a try exits early when a PR for that date already exists.
# The PR publishes after 19:00 UTC (14:00 for Gorka) unless vetoed (publish.yml).
# While DRY_RUN=true, dry-run sloppers are also kept on the `calibration` branch so later days have history.
name: generate

on:
  schedule:
    - cron: '7 11 * * *'
    - cron: '7 13 * * *'
    - cron: '7 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Slopper date (YYYY-MM-DD, UTC). Empty = yesterday.'
        required: false
        type: string
      scheduled:
        description: 'Behave like a scheduled run (skip if a PR for the date already exists). Used by the slopper-clock Worker.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: generate-${{ inputs.date || 'daily' }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
  LAUNCH_DATE: ${{ vars.LAUNCH_DATE }}
  SITE_URL: ${{ vars.SITE_URL || 'https://slopper.logicos.org' }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      date: ${{ steps.date.outputs.date }}
      path: ${{ steps.date.outputs.path }}
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Slopper date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          d="${INPUT_DATE:-$(date -u -d yesterday +%F)}"
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad date '$d'"; exit 1; }
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "path=sloppers/${d//-//}" >> "$GITHUB_OUTPUT"
      - name: Already done today?
        id: done
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULED: ${{ inputs.scheduled }}
        run: |
          # Scheduled tries (GitHub cron, or the slopper-clock Worker with scheduled=true) stop here when an earlier
          # try already opened a PR (open or closed, any attempt) for this date. Manual runs (and regenerate) always proceed.
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json headRefName \
            --jq "[.[] | select(.headRefName | test(\"^slopper/${{ steps.date.outputs.date }}(-[0-9]+)?$\"))] | length")
          if { [ "$EVENT" = schedule ] || [ "$SCHEDULED" = true ]; } && [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A PR for ${{ steps.date.outputs.date }} already exists: nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch sources
        if: steps.done.outputs.skip != 'true'
        run: npm run fetch -- --date "${{ steps.date.outputs.date }}" --out digest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.done.outputs.skip != 'true'
        with:
          name: digest
          path: digest.json
          if-no-files-found: error
          retention-days: 7

  create:
    needs: fetch
    if: needs.fetch.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # includes one 15-minute wait on a usage limit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Calibration history (dry runs)
        if: env.DRY_RUN == 'true'
        run: |
          # Earlier dry-run sloppers (and their storylines) live on the calibration branch, not on main.
          if git fetch -q --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" calibration 2>/dev/null; then
            git checkout FETCH_HEAD -- sloppers 2>/dev/null && echo "Loaded $(find sloppers -name day.json | wc -l) earlier dry-run day(s)" || echo "calibration has no sloppers yet"
          else
            echo "No calibration branch yet"
          fi
          rm -rf "${{ needs.fetch.outputs.path }}" # an older attempt at this same date must not leak into this run
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest
          path: ${{ needs.fetch.outputs.path }}
      - name: Curate → art ⟲ critic → cop → package
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run day -- --date "${{ needs.fetch.outputs.date }}" --from-stage curate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slopper
          path: ${{ needs.fetch.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  open-pr:
    needs: [fetch, create]
    if: needs.fetch.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slopper
          path: ${{ needs.fetch.outputs.path }}
      # Nothing produced by the AI job is trusted: re-validate before any token exists in this job.
      - name: Verify the slopper folder
        run: npm run verify:sloppers -- "${{ needs.fetch.outputs.path }}"
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Commit, push, open PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SLUG: ${{ steps.bot.outputs.app-slug }}
          DATE: ${{ needs.fetch.outputs.date }}
          DIR: ${{ needs.fetch.outputs.path }}
          PUBLISH_HOUR_UTC: ${{ vars.PUBLISH_HOUR_UTC || '19' }}
          VETO_MODE: ${{ vars.VETO_MODE || 'window' }}
        run: |
          set -euo pipefail
          # One branch per attempt (decision 47): slopper/<date>, slopper/<date>-2, … Earlier attempts keep their
          # branches, so any of them can be reopened and published. Names come from existing branches and PR heads.
          {
            git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY.git" "slopper/$DATE*" | sed 's#.*refs/heads/##'
            gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json headRefName --jq '.[].headRefName'
          } > used-branches.txt
          read -r branch attempt < <(npm run -s attempt -- next "$DATE" < used-branches.txt)
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          uid=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${uid}+${SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          cp "$DIR/storylines.json" knowledge/storylines.json
          git add "$DIR" knowledge/storylines.json
          title=$(head -n 1 "$DIR/pr.md" | sed 's/^# //')
          if [ "$attempt" -gt 1 ]; then title="$title · attempt $attempt"; fi
          labels=$(sed -n "s/^Labels: //p" "$DIR/pr.md" | head -n 1 | tr -d " ")
          git commit -q -m "$title" -m "Generated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" "$branch"
          # Image links use the commit id, not the branch name: a regeneration reuses the branch name, and Telegram
          # and GitHub cache images by URL, so a branch URL showed the previous attempt's image (2026-10-02).
          raw="https://github.com/$GITHUB_REPOSITORY/raw/$(git rev-parse HEAD)/$DIR"
          {
            tail -n +5 "$DIR/pr.md" | sed "s#](still.png)#]($raw/still.png)#"
            echo
            if [ "$VETO_MODE" = window ]; then echo "⏰ Publishes after **${PUBLISH_HOUR_UTC}:00 UTC** today unless labeled \`veto\`."; fi
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          # Requesting Gorka's review makes GitHub Mobile send a push notification.
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body-file body.md --label "$labels" --reviewer "$GITHUB_REPOSITORY_OWNER")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "image=$raw/still.png" >> "$GITHUB_OUTPUT"
      - name: Keep the dry run on the calibration branch
        if: env.DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DIR: ${{ needs.fetch.outputs.path }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          work="$RUNNER_TEMP/calibration"
          if git fetch -q "$remote" calibration 2>/dev/null; then git worktree add -q "$work" FETCH_HEAD
          else git worktree add -q "$work" origin/main 2>/dev/null || git worktree add -q "$work" HEAD~1; fi
          rm -rf "${work:?}/$DIR" && mkdir -p "$work/$DIR" && cp -R "$DIR/." "$work/$DIR/"
          cd "$work"
          git add "$DIR"
          if git diff --cached --quiet; then echo "calibration already up to date"; exit 0; fi
          git commit -q -m "Calibration: $(head -n 1 "$DIR/pr.md" | sed 's/^# //')"
          git push -q "$remote" HEAD:refs/heads/calibration
          echo "Saved $DIR on the calibration branch"
      - name: Notify on Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          REVIEWER_UTC_OFFSET: ${{ vars.REVIEWER_UTC_OFFSET || '-5' }}
          VETO_MODE: ${{ vars.VETO_MODE || 'window' }}
          PUBLISH_HOUR_UTC: ${{ vars.PUBLISH_HOUR_UTC || '19' }}
        run: npm run -s notify -- pr --dir "${{ needs.fetch.outputs.path }}" --pr-url "${{ steps.pr.outputs.url }}" --image-url "${{ steps.pr.outputs.image }}" --attempt "${{ steps.pr.outputs.attempt }}"

  report-failure:
    needs: [fetch, create, open-pr]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update a pipeline-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.fetch.outputs.date || inputs.date || 'unknown date' }}
        run: |
          title="Pipeline failure: generate $DATE"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label pipeline-failure --body "The daily generation failed. Logs: $run"; fi
      - name: Alert on Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ vars.TELEGRAM_CHAT_ID }}
          DATE: ${{ needs.fetch.outputs.date || inputs.date || 'unknown date' }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$CHAT" ] || { echo "Telegram not configured"; exit 0; }
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS --fail-with-body -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ Slopper generate failed ($DATE). Logs: $run"
