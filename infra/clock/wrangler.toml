# slopper-clock: starts the GitHub workflows on time (see src/index.ts). Deploy:
#   npx wrangler deploy --config infra/clock/wrangler.toml
# Secret (once): npx wrangler secret put GITHUB_TOKEN --config infra/clock/wrangler.toml
name = "slopper-clock"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# No public address: no workers.dev URL, no preview URLs, no routes.
workers_dev = false
preview_urls = false

[triggers]
crons = ["7 11 * * *", "7 13 * * *", "5 * * * *"]

[vars]
REPO = "gllona/slopper"

[observability]
enabled = true
