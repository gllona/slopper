<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="A rising building climbs a diagonal stack of coins toward a cloud, while across the frame a shrinking building's tiny rocket sits deep inside a much larger dashed rocket outline. Between the two buildings, a happy investor raises a very tall price tag toward the coin building and a worried investor holds a short price tag near their own head, both standing in front of a small falling stock chart." data-harness="0.2.0" data-style="riso-duotone"><title>A rising building climbs a diagonal stack of coins toward a cloud, while across the frame a shrinking building&apos;s tiny rocket sits deep inside a much larger dashed rocket outline. Between the two buildings, a happy investor raises a very tall price tag toward the coin building and a worried investor holds a short price tag near their own head, both standing in front of a small falling stock chart.</title><defs><filter id="grain" x="0" y="0" width="216" height="216" filterUnits="userSpaceOnUse"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.141  0 0 0 0 0.278  0 0 0 0 0.604  0 0 0 -2.2 1.25"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 0.45 0.9"/></feComponentTransfer></filter><pattern id="grain-tile" width="216" height="216" patternUnits="userSpaceOnUse"><rect width="216" height="216" filter="url(#grain)"/></pattern></defs><style>svg{--bg:#F4ECDD;--ink:#24479A;--accent1:#FF5C8D;--accent2:#9FBBEA;--paper:#FFF9EF}.el *{stroke-linecap:round;stroke-linejoin:round}.r-body{fill:#9FBBEA;stroke:#24479A;stroke-width:7;mix-blend-mode:multiply}.r-body-alt{fill:#FFF9EF;stroke:#24479A;stroke-width:7}.r-accent{fill:#FF5C8D;stroke:#24479A;stroke-width:7;mix-blend-mode:multiply}.r-accent-2{fill:#9FBBEA;stroke:none;mix-blend-mode:multiply}.r-ink{fill:#24479A;stroke:none;mix-blend-mode:multiply}.r-paper{fill