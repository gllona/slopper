79A;stroke-width:7}.r-line{fill:none;stroke:#24479A;stroke-width:7}.r-thin{fill:none;stroke:#24479A;stroke-width:3.9}.r-shade{fill:#24479A;stroke:none;opacity:0.16;mix-blend-mode:multiply}.r-glow{fill:#FF5C8D;stroke:none;opacity:0.45;mix-blend-mode:multiply}.r-text{fill:#24479A;stroke:none;mix-blend-mode:multiply}.t-accent{fill:#FF5C8D;stroke:none}.t-paper{fill:#FFF9EF;stroke:none}#a-building{transform-box:fill-box;transform-origin:50% 50%}#a-eye{transform-box:fill-box;transform-origin:50% 50%}#a-worker{transform-box:fill-box;transform-origin:50% 100%}#p-worker--face-worried{transform-box:fill-box;transform-origin:50% 50%}#p-worker--arm-l{transform-box:fill-box;transform-origin:50% 6%}#p-worker--arm-r{transform-box:fill-box;transform-origin:50% 6%}#a-paperroll{transform-box:fill-box;transform-origin:50% 50%}#a-bubble{transform-box:fill-box;transform-origin:50% 50%}#a-shield{transform-box:fill-box;transform-origin:50% 50%}#a-documents{transform-box:fill-box;transform-origin:50% 50%}</style><g id="background"><rect width="1080" height="1080" fill="#F4ECDD"/></g><g class="el" data-el="building" transform="translate(540 602.4)"><g id="a-building" class="anim"><g transform="translate(-410 -240)"><rect class="r-body-alt" x="30" y="20" width="760" height="440" rx="22"/><rect class="r-ink" x="405" y="20" width="12" height="440"/><rect class="r-paper" x="70" y="140" width="300" height="260" rx="16"/><line class="r-thin" x1="110" y1="330" x2="340" y2="330"/><rect class="r-line" x="560" y="250" width="180" height="210" rx="14"/><rect class="r-shade" x="574" y="264" width="152" height="182" rx="10"/></g></g></g><g class="el" data-el="eye" transform="translate(453.6 291.6) rotate(-6) scale(1.4 1.4)"><g id="a-eye" class="anim"><g transform="translate(-280 -130)"><circle class="r-paper" cx="110" cy="170" r="78"/><circle class="r-thin" cx="85" cy="140" r="18"/><rect class="r-ink" x="-13" y="0" width="26" height="100" rx="13" transform="translate(165,115) rotate(-40)"/><line class="